<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WorkLog Private" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<title>WorkLog Private</title>
<style>
:root{
  --bg:#07090f; --bg2:#0d111a; --card:rgba(255,255,255,.075); --card2:rgba(255,255,255,.105);
  --line:rgba(255,255,255,.12); --text:#f7f8fb; --muted:#8e98aa; --soft:#c8cfda;
  --accent:#b8ff70; --accent2:#6ee7f9; --danger:#ff6b6b; --warn:#ffd166; --blue:#7aa7ff;
  --radius:24px; --shadow:0 20px 70px rgba(0,0,0,.35); --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100dvh}
body{max-width:520px;margin:0 auto;overflow-x:hidden;background:
 radial-gradient(circle at 20% -10%,rgba(184,255,112,.18),transparent 34%),
 radial-gradient(circle at 95% 4%,rgba(110,231,249,.13),transparent 28%),
 linear-gradient(180deg,#07090f 0%,#0a0d14 100%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}select,input,textarea{outline:none}
.app{min-height:100dvh;padding:18px 16px calc(92px + var(--safe))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 18px}.brand h1{font-size:22px;letter-spacing:-.8px}.brand p{font-size:12px;color:var(--muted);margin-top:3px}.iconbtn{width:42px;height:42px;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero{position:relative;border:1px solid var(--line);border-radius:32px;padding:22px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.055));box-shadow:var(--shadow);overflow:hidden}.hero:before{content:"";position:absolute;right:-55px;top:-55px;width:150px;height:150px;background:radial-gradient(circle,rgba(184,255,112,.36),transparent 68%)}.monthrow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}.monthrow button{width:38px;height:38px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}.month{text-align:center}.month strong{font-size:19px}.month span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.bigstat{margin-top:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px}.stat{border:1px solid var(--line);border-radius:22px;padding:16px;background:rgba(0,0,0,.18)}.stat label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.9px}.stat b{display:block;font-size:32px;margin-top:8px;letter-spacing:-1.5px}.stat small{color:var(--soft)}
.tabs{position:fixed;left:50%;bottom:calc(12px + var(--safe));transform:translateX(-50%);z-index:50;width:min(488px,calc(100% - 24px));height:68px;border-radius:24px;background:rgba(16,20,30,.78);border:1px solid var(--line);backdrop-filter:blur(26px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;box-shadow:0 18px 60px rgba(0,0,0,.45)}.tab{border-radius:18px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}.tab span{font-size:18px}.tab.on{background:rgba(255,255,255,.1);color:var(--text)}
.fab{position:fixed;right:calc(50% - min(260px,50vw) + 22px);bottom:calc(94px + var(--safe));z-index:60;width:62px;height:62px;border-radius:24px;background:linear-gradient(145deg,var(--accent),#79ffb2);color:#071006;font-size:30px;font-weight:700;box-shadow:0 18px 50px rgba(184,255,112,.28)}
.view{display:none;animation:fade .22s ease}.view.on{display:block}@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:20px 3px 12px}.section-title h2{font-size:18px;letter-spacing:-.5px}.section-title p{font-size:12px;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:10px}.entry{display:grid;grid-template-columns:52px 1fr;gap:12px;border:1px solid var(--line);border-radius:24px;padding:12px;background:var(--card);backdrop-filter:blur(18px)}.datepill{width:52px;height:62px;border-radius:18px;background:rgba(255,255,255,.085);display:grid;place-items:center;text-align:center}.datepill b{font-size:21px}.datepill span{font-size:10px;color:var(--muted);text-transform:uppercase}.entry h3{font-size:15px;margin:2px 0 6px}.entry p{font-size:12px;color:var(--muted);line-height:1.35}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;color:var(--soft);background:rgba(255,255,255,.075);border:1px solid var(--line);border-radius:999px;padding:5px 9px}.empty{border:1px dashed var(--line);border-radius:26px;padding:30px;text-align:center;color:var(--muted);background:rgba(255,255,255,.04)}
.calendar{border:1px solid var(--line);border-radius:28px;padding:14px;background:var(--card);backdrop-filter:blur(18px)}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:var(--muted);font-size:11px;padding:6px 0}.day{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;position:relative}.day.emptyday{opacity:0}.day.today{border-color:rgba(184,255,112,.65)}.day.has{background:rgba(255,255,255,.11)}.dot{width:6px;height:6px;border-radius:99px;background:var(--accent)}.dot.pushim{background:var(--danger)}.dot.semure{background:var(--warn)}.dot.leje{background:var(--blue)}.hrs{font-size:9px;color:var(--muted)}
.cards{display:grid;gap:12px}.panel{border:1px solid var(--line);border-radius:26px;padding:16px;background:var(--card);backdrop-filter:blur(18px)}.panel h3{font-size:15px;margin-bottom:12px}.bar{height:10px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.rows{display:grid;gap:9px}.row{display:flex;justify-content:space-between;color:var(--soft);font-size:13px}.row span{color:var(--muted)}
.sheetwrap{position:fixed;inset:0;z-index:100;display:none}.sheetwrap.on{display:block}.shade{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:92dvh;overflow:auto;border-radius:32px 32px 0 0;background:#10141f;border:1px solid var(--line);padding:18px 16px calc(24px + var(--safe));box-shadow:0 -25px 80px rgba(0,0,0,.55)}.grab{width:46px;height:5px;background:rgba(255,255,255,.22);border-radius:99px;margin:0 auto 14px}.formgrid{display:grid;gap:13px}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 7px 3px}.input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.075);border-radius:18px;padding:14px;color:var(--text)}textarea{resize:vertical;min-height:88px}.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.typebtn{padding:12px 6px;border-radius:18px;background:rgba(255,255,255,.075);border:1px solid var(--line);font-size:12px}.typebtn.on{background:rgba(184,255,112,.18);border-color:rgba(184,255,112,.55);color:var(--accent)}.quickhrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quickhrs button{padding:10px;border-radius:15px;background:rgba(255,255,255,.075);border:1px solid var(--line);font-size:13px}.quickhrs button.on{background:rgba(255,255,255,.16);border-color:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.primary,.secondary,.danger{height:50px;border-radius:18px;font-weight:700}.primary{background:linear-gradient(145deg,var(--accent),#78ffad);color:#071006}.secondary{background:rgba(255,255,255,.08);border:1px solid var(--line)}.danger{background:rgba(255,107,107,.14);color:#ff9a9a;border:1px solid rgba(255,107,107,.3)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.photo{aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:rgba(255,255,255,.06);border:1px solid var(--line)}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65)}.filebtn{display:block;text-align:center;border:1px dashed var(--line);border-radius:18px;padding:16px;color:var(--soft);background:rgba(255,255,255,.04)}#photoInput{display:none}.toast{position:fixed;left:50%;bottom:calc(172px + var(--safe));transform:translateX(-50%) translateY(20px);background:rgba(20,25,34,.92);border:1px solid var(--line);border-radius:18px;padding:12px 16px;z-index:200;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:521px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>WorkLog Private</h1><p>Personal work timeline</p></div>
    <button class="iconbtn" onclick="openSettings()">⚙️</button>
  </header>

  <section class="hero">
    <div class="monthrow">
      <button onclick="moveMonth(-1)">‹</button>
      <div class="month"><strong id="monthName"></strong><span id="monthYear"></span></div>
      <button onclick="moveMonth(1)">›</button>
    </div>
    <div class="bigstat">
      <div class="stat"><label>Orë këtë muaj</label><b id="totalHours">0h</b><small id="workDays">0 ditë pune</small></div>
      <div class="stat"><label>Regjistrime</label><b id="totalEntries">0</b><small id="photoCount">0 foto</small></div>
    </div>
  </section>

  <main>
    <section id="home" class="view on">
      <div class="section-title"><h2>Timeline</h2><p id="todayHint"></p></div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section id="calendar" class="view">
      <div class="section-title"><h2>Calendar</h2><p>tap për editim</p></div>
      <div class="calendar"><div class="week"><div>H</div><div>M</div><div>M</div><div>E</div><div>P</div><div>S</div><div>D</div></div><div id="calGrid" class="grid"></div></div>
    </section>

    <section id="stats" class="view">
      <div class="section-title"><h2>Stats</h2><p>pamje personale</p></div>
      <div class="cards">
        <div class="panel"><h3>Progresi i muajit</h3><div class="bar"><i id="monthProgress"></i></div><div class="row"><span>Ditë të regjistruara</span><b id="statEntries">0</b></div></div>
        <div class="panel"><h3>Përmbledhje</h3><div class="rows" id="summaryRows"></div></div>
        <div class="panel"><h3>Veprime</h3><div class="actions"><button class="secondary" onclick="exportJSON()">Backup JSON</button><button class="secondary" onclick="document.getElementById('importInput').click()">Import</button><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="primary" onclick="exportPDF()">PDF</button></div><input id="importInput" type="file" accept="application/json" hidden></div>
      </div>
    </section>

    <section id="settings" class="view">
      <div class="section-title"><h2>Settings</h2><p>private</p></div>
      <div class="cards">
        <div class="panel"><h3>Preferenca</h3><div class="field"><label>Orët default</label><input class="input" id="defaultHours" type="number" min="0" max="24" step="0.5"></div></div>
        <div class="panel"><h3>Reminder</h3><div class="row"><span>Kujtesë ditore</span><input id="reminderOn" type="checkbox"></div><br><div class="field"><label>Ora</label><input class="input" id="reminderTime" type="time"></div></div>
      </div>
    </section>
  </main>
</div>

<button class="fab" onclick="openDay(new Date().getDate())">+</button>
<nav class="tabs">
  <button class="tab on" data-view="home"><span>⌁</span>Home</button>
  <button class="tab" data-view="calendar"><span>□</span>Calendar</button>
  <button class="tab" data-view="stats"><span>↗</span>Stats</button>
  <button class="tab" data-view="settings"><span>⚙</span>Settings</button>
</nav>

<div id="sheetWrap" class="sheetwrap">
  <div class="shade" onclick="closeSheet()"></div>
  <section class="sheet">
    <div class="grab"></div>
    <div class="section-title" style="margin-top:0"><h2 id="sheetTitle">Regjistro ditën</h2><p id="sheetSub"></p></div>
    <div class="formgrid">
      <div class="field"><label>Statusi</label><div class="typegrid">
        <button class="typebtn" data-type="work">Punë</button><button class="typebtn" data-type="pushim">Pushim</button><button class="typebtn" data-type="semure">Sëmurë</button><button class="typebtn" data-type="leje">Leje</button>
      </div></div>
      <div class="field" id="hoursBox"><label>Orët e punuara</label><input class="input" id="hoursInput" type="number" min="0" max="24" step="0.5"><div class="quickhrs" id="quickHours"></div></div>
      <div class="field"><label>Puna / tag</label><input class="input" id="jobInput" placeholder="p.sh. Parket, Fasadë, Depot"></div>
      <div class="field"><label>Lokacioni</label><input class="input" id="locInput" placeholder="p.sh. Genève, Carouge"></div>
      <div class="field"><label>Shënime</label><textarea id="notesInput" placeholder="Shënim i shkurtër..."></textarea></div>
      <div class="field"><label>Foto provë</label><label class="filebtn" for="photoInput">＋ Shto foto</label><input id="photoInput" type="file" accept="image/*" multiple><div id="photosGrid" class="photos"></div></div>
    </div>
    <div class="actions"><button class="danger" onclick="deleteDay()">Fshi</button><button class="primary" onclick="saveDay()">Ruaj</button></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
const MONTHS=['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
const DOW=['E Diel','E Hënë','E Martë','E Mërkurë','E Enjte','E Premte','E Shtunë'];
const DOWS=['Die','Hën','Mar','Mër','Enj','Pre','Sht'];
let now=new Date(), Y=now.getFullYear(), M=now.getMonth(), data={}, selectedDay=null, selectedPhotos=[];
const key=()=>`wr-${Y}-${String(M+1).padStart(2,'0')}`;
const load=()=>{try{data=JSON.parse(localStorage.getItem(key())||'{}')}catch{data={}}};
const save=()=>{localStorage.setItem(key(),JSON.stringify(data));localStorage.setItem('wr-backup-last',JSON.stringify(collectBackup()));localStorage.setItem('wr-backup-at',new Date().toISOString())};
const fmtH=v=>{const n=Number(v||0);return Number.isInteger(n)?n:n.toFixed(1).replace('.',',')};
const daysInMonth=()=>new Date(Y,M+1,0).getDate();
const offset=()=>{const d=new Date(Y,M,1).getDay();return(d+6)%7};
function collectBackup(){const months={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^wr-\d{4}-\d{2}$/.test(k)){try{months[k]=JSON.parse(localStorage.getItem(k)||'{}')}catch{}}}return{version:'private-v6',exportedAt:new Date().toISOString(),months,settings:{defaultHours:localStorage.getItem('wr-default-hours')||'8',reminderOn:localStorage.getItem('rem-en')||'false',reminderTime:localStorage.getItem('rem-t')||'17:00'}}}
function applyBackup(b){if(!b||!b.months)throw Error('Backup jo valid');Object.keys(localStorage).filter(k=>/^wr-\d{4}-\d{2}$/.test(k)).forEach(k=>localStorage.removeItem(k));Object.entries(b.months).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v||{})));if(b.settings){localStorage.setItem('wr-default-hours',b.settings.defaultHours||'8');localStorage.setItem('rem-en',b.settings.reminderOn||'false');localStorage.setItem('rem-t',b.settings.reminderTime||'17:00')}load();render();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200)}
function typeName(t){return{work:'Punë',pushim:'Pushim',semure:'Sëmurë',leje:'Leje'}[t]||'Punë'}
function render(){document.getElementById('monthName').textContent=MONTHS[M];document.getElementById('monthYear').textContent=Y;renderStats();renderTimeline();renderCalendar();renderSettings();}
function renderStats(){let h=0,w=0,p=0,s=0,l=0,photos=0;Object.values(data).forEach(e=>{if(e.type==='work'){w++;h+=Number(e.hrs||0)}else if(e.type==='pushim')p++;else if(e.type==='semure')s++;else if(e.type==='leje')l++;photos+=(Array.isArray(e.photos)?e.photos.length:(e.photo?1:0))});let entries=Object.keys(data).length;document.getElementById('totalHours').textContent=fmtH(h)+'h';document.getElementById('workDays').textContent=w+' ditë pune';document.getElementById('totalEntries').textContent=entries;document.getElementById('photoCount').textContent=photos+' foto';document.getElementById('todayHint').textContent=new Date().toLocaleDateString('sq-CH');document.getElementById('statEntries').textContent=entries+'/'+daysInMonth();document.getElementById('monthProgress').style.width=Math.min(100,entries/daysInMonth()*100)+'%';document.getElementById('summaryRows').innerHTML=`<div class="row"><span>Punë</span><b>${w}</b></div><div class="row"><span>Pushim</span><b>${p}</b></div><div class="row"><span>Sëmurë</span><b>${s}</b></div><div class="row"><span>Leje</span><b>${l}</b></div><div class="row"><span>Foto</span><b>${photos}</b></div>`}
function renderTimeline(){const box=document.getElementById('timeline');box.innerHTML='';const items=Object.entries(data).map(([d,e])=>({d:Number(d),e})).sort((a,b)=>b.d-a.d);if(!items.length){box.innerHTML='<div class="empty">Ende nuk ka regjistrime për këtë muaj.<br>Prek + për të shtuar ditën e parë.</div>';return}items.forEach(({d,e})=>{const dt=new Date(Y,M,d);const pc=Array.isArray(e.photos)?e.photos.length:(e.photo?1:0);const div=document.createElement('article');div.className='entry';div.onclick=()=>openDay(d);div.innerHTML=`<div class="datepill"><div><b>${d}</b><span>${DOWS[dt.getDay()]}</span></div></div><div><h3>${typeName(e.type)} ${e.type==='work'&&e.hrs?'· '+fmtH(e.hrs)+'h':''}</h3><p>${[e.job,e.loc,e.notes].filter(Boolean).join(' · ')||'Pa shënime'}</p><div class="meta">${e.job?`<span class="chip"># ${escapeHtml(e.job)}</span>`:''}${e.loc?`<span class="chip">📍 ${escapeHtml(e.loc)}</span>`:''}${pc?`<span class="chip">📷 ${pc}</span>`:''}</div></div>`;box.appendChild(div)})}
function renderCalendar(){const g=document.getElementById('calGrid');g.innerHTML='';for(let i=0;i<offset();i++){const e=document.createElement('div');e.className='day emptyday';g.appendChild(e)}for(let d=1;d<=daysInMonth();d++){const e=data[d];const cell=document.createElement('button');cell.className='day '+(e?'has ':'')+(d===now.getDate()&&M===now.getMonth()&&Y===now.getFullYear()?'today':'');cell.onclick=()=>openDay(d);cell.innerHTML=`<b>${d}</b>${e?`<i class="dot ${e.type}"></i>${e.type==='work'?`<span class="hrs">${fmtH(e.hrs)}h</span>`:''}`:''}`;g.appendChild(cell)}}
function moveMonth(n){M+=n;if(M<0){M=11;Y--}if(M>11){M=0;Y++}load();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.view).classList.add('on')});
function openSettings(){document.querySelector('[data-view="settings"]').click()}
function openDay(d){selectedDay=d;const e=data[d]||{};selectedPhotos=Array.isArray(e.photos)?[...e.photos]:(e.photo?[e.photo]:[]);document.getElementById('sheetTitle').textContent='Dita '+d;document.getElementById('sheetSub').textContent=DOW[new Date(Y,M,d).getDay()]+' · '+MONTHS[M];document.querySelectorAll('.typebtn').forEach(b=>{b.classList.toggle('on',(e.type||'work')===b.dataset.type)});document.getElementById('hoursInput').value=e.hrs??(localStorage.getItem('wr-default-hours')||8);document.getElementById('jobInput').value=e.job||'';document.getElementById('locInput').value=e.loc||'';document.getElementById('notesInput').value=e.notes||'';renderQuickHours();renderPhotos();updateHoursBox();document.getElementById('sheetWrap').classList.add('on')}
function closeSheet(){document.getElementById('sheetWrap').classList.remove('on');selectedDay=null}
document.querySelectorAll('.typebtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.typebtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');updateHoursBox()});
function currentType(){return document.querySelector('.typebtn.on')?.dataset.type||'work'}
function updateHoursBox(){document.getElementById('hoursBox').style.display=currentType()==='work'?'block':'none'}
function renderQuickHours(){const q=document.getElementById('quickHours');q.innerHTML='';[4,6,7,7.5,8,8.5,9,10].forEach(v=>{const b=document.createElement('button');b.textContent=fmtH(v)+'h';b.onclick=()=>{document.getElementById('hoursInput').value=v;renderQuickHours()};b.classList.toggle('on',Number(document.getElementById('hoursInput').value)===v);q.appendChild(b)})}
document.getElementById('hoursInput').oninput=renderQuickHours;
document.getElementById('photoInput').onchange=e=>{const files=[...(e.target.files||[])];if(!files.length)return;let done=0;files.forEach(f=>{const r=new FileReader();r.onload=()=>{selectedPhotos.push(r.result);done++;if(done===files.length){renderPhotos();toast(files.length+' foto u shtuan')}};r.readAsDataURL(f)});e.target.value=''};
function renderPhotos(){const g=document.getElementById('photosGrid');g.innerHTML='';selectedPhotos.forEach((src,i)=>{const d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${src}"><button type="button">×</button>`;d.querySelector('button').onclick=()=>{selectedPhotos.splice(i,1);renderPhotos()};g.appendChild(d)})}
function saveDay(){const t=currentType();data[selectedDay]={type:t,hrs:t==='work'?Math.max(0,Math.min(24,Math.round(Number(document.getElementById('hoursInput').value||0)*2)/2)):0,job:document.getElementById('jobInput').value.trim(),loc:document.getElementById('locInput').value.trim(),notes:document.getElementById('notesInput').value.trim(),photos:selectedPhotos};save();closeSheet();render();toast('U ruajt')}
function deleteDay(){if(selectedDay&&data[selectedDay]){delete data[selectedDay];save();closeSheet();render();toast('U fshi')}}
function exportJSON(){download('WorkLog-Backup-'+Y+'-'+String(M+1).padStart(2,'0')+'.json',JSON.stringify(collectBackup(),null,2),'application/json')}
document.getElementById('importInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{applyBackup(JSON.parse(await f.text()));toast('Backup u importua')}catch{toast('Import i pasuksesshëm')}e.target.value=''};
function exportCSV(){let rows=[['Data','Lloji','Ore','Puna','Lokacioni','Shenime','Foto']];for(let d=1;d<=daysInMonth();d++){const e=data[d];if(!e)continue;rows.push([`${Y}-${String(M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,typeName(e.type),e.type==='work'?e.hrs:0,e.job||'',e.loc||'',e.notes||'',Array.isArray(e.photos)?e.photos.length:0])}download('WorkLog-'+Y+'-'+String(M+1).padStart(2,'0')+'.csv',rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let h=0,w=0,photos=0;Object.values(data).forEach(e=>{if(e.type==='work'){w++;h+=Number(e.hrs||0)}photos+=Array.isArray(e.photos)?e.photos.length:0});doc.setFillColor(7,9,15);doc.rect(0,0,210,38,'F');doc.setTextColor(255,255,255);doc.setFontSize(20);doc.text('WorkLog Private',16,18);doc.setFontSize(11);doc.text(`${MONTHS[M]} ${Y}`,16,28);doc.setTextColor(20,20,20);doc.setFontSize(13);doc.text(`Ore totale: ${fmtH(h)}h   Dite pune: ${w}   Foto: ${photos}`,16,50);let y=64;doc.setFontSize(9);doc.setTextColor(90,90,90);doc.text('Data',16,y);doc.text('Lloji',42,y);doc.text('Ore',72,y);doc.text('Puna / Lokacioni / Shenime',92,y);y+=6;doc.setDrawColor(220);doc.line(16,y,194,y);y+=7;for(let d=1;d<=daysInMonth();d++){const e=data[d];if(!e)continue;if(y>280){doc.addPage();y=20}doc.setTextColor(30,30,30);doc.text(`${String(d).padStart(2,'0')}.${String(M+1).padStart(2,'0')}.${Y}`,16,y);doc.text(typeName(e.type),42,y);doc.text(e.type==='work'?fmtH(e.hrs)+'h':'-',72,y);doc.text(((e.job?e.job+' / ':'')+(e.loc?e.loc+' / ':'')+(e.notes||'')).substring(0,70),92,y);y+=8}doc.save('WorkLog-'+Y+'-'+String(M+1).padStart(2,'0')+'.pdf')}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderSettings(){document.getElementById('defaultHours').value=localStorage.getItem('wr-default-hours')||'8';document.getElementById('reminderOn').checked=localStorage.getItem('rem-en')==='true';document.getElementById('reminderTime').value=localStorage.getItem('rem-t')||'17:00'}
document.getElementById('defaultHours').onchange=e=>{localStorage.setItem('wr-default-hours',e.target.value||'8');toast('U ruajt')};document.getElementById('reminderOn').onchange=e=>{localStorage.setItem('rem-en',e.target.checked);scheduleReminder();toast('Reminder u ruajt')};document.getElementById('reminderTime').onchange=e=>{localStorage.setItem('rem-t',e.target.value||'17:00');scheduleReminder();toast('Reminder u ruajt')};
function scheduleReminder(){if(!('serviceWorker'in navigator)||!('Notification'in window))return;if(Notification.permission==='default')Notification.requestPermission();navigator.serviceWorker.ready.then(reg=>{if(Notification.permission!=='granted'||localStorage.getItem('rem-en')!=='true')return;const [hh,mm]=(localStorage.getItem('rem-t')||'17:00').split(':').map(Number);const target=new Date();target.setHours(hh,mm,0,0);const delay=target-new Date();if(delay>0)reg.active?.postMessage({type:'SCHEDULE_REMINDER',delay})})}
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(scheduleReminder).catch(()=>{})}
load();render();
</script>
</body>
